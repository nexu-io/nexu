name: Test Linux CI Build

on:
  workflow_dispatch:

jobs:
  test-linux-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        env:
          NEXU_CLOUD_URL: https://nexu.io
          NEXU_LINK_URL: https://link.nexu.io
          NEXU_DESKTOP_BUILD_SOURCE: test
        run: |
          export NEXU_DESKTOP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          pnpm --filter @nexu/desktop dist:linux
